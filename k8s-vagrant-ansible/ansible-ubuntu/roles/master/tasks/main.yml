---
- name: Create swap file (4GB) on master to prevent OOM
  command: fallocate -l 4G /swapfile
  args:
    creates: /swapfile

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: '0600'

- name: Format swap file
  command: mkswap /swapfile
  args:
    creates: /proc/swaps # not ideal but mkswap is safe to run again
  changed_when: false

- name: Enable swap
  command: swapon /swapfile
  changed_when: false
  failed_when: false

- name: Persist swap in fstab
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'
    state: present

- name: Configure kubelet to tolerate swap (master uses swap for OOM protection)
  copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--fail-swap-on=false\n"
    mode: '0644'
  become: true

- name: Check if Kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_config

# If admin.conf was written by a previously failed kubeadm init (e.g. the
# API server never became healthy so RBAC bootstrap never completed), we
# must treat it as uninitialized and run a full reset + reinit.
- name: Verify control plane RBAC is healthy (requires working admin bootstrap)
  shell: kubectl get nodes --request-timeout=15s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: k8s_health
  failed_when: false
  changed_when: false
  when: kubeadm_config.stat.exists

- name: Remove stale admin.conf if cluster is unhealthy (triggers full re-init)
  file:
    path: /etc/kubernetes/admin.conf
    state: absent
  when: kubeadm_config.stat.exists and (k8s_health.rc is defined and k8s_health.rc != 0)

- name: Recheck initialization state after health verification
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_config

- name: Restart containerd to ensure it's running
  systemd:
    name: containerd
    state: restarted
    enabled: true

- name: Wait for containerd socket to be ready
  wait_for:
    path: /run/containerd/containerd.sock
    state: present
    timeout: 60

- name: Stabilize clock before kubeadm init
  become: true
  shell: |
    # Step-correct twice so chrony has had a chance to poll NTP.
    chronyc makestep 2>/dev/null || true
    sleep 3
    chronyc makestep 2>/dev/null || true
    # *** Stop chrony entirely for the duration of kubeadm init. ***
    # A clock jump DURING init (cert generation → apiserver start) causes
    # TLS "certificate not yet valid" failures: certs are written with the
    # pre-jump time as notBefore; after the jump the time is earlier, so
    # every HTTPS call to /livez fails and kubeadm loops until the
    # context deadline (which was itself set from the drifted clock).
    systemctl stop chrony
    # Sync from VirtualBox hardware clock (kept in sync with Windows host)
    hwclock --hctosys 2>/dev/null || true
    echo "Clock stabilized at: $(date -u --rfc-3339=seconds)"
  when: not kubeadm_config.stat.exists

- name: Reset any partial kubeadm state before init
  become: true
  shell: |
    kubeadm reset -f
    rm -rf /etc/kubernetes/manifests /etc/kubernetes/pki /var/lib/etcd
  when: not kubeadm_config.stat.exists
  ignore_errors: true

- name: Kill any lingering control-plane processes after reset
  become: true
  shell: |
    # /proc/<pid>/comm is capped at 15 chars — use truncated names.
    # Do NOT use pkill -f: it matches the full cmdline including the
    # text of this shell script, which would kill the Ansible runner.
    pkill -9 kube-apiserver  2>/dev/null || true
    pkill -9 kube-scheduler  2>/dev/null || true
    pkill -9 kube-controller 2>/dev/null || true  # kube-controller-manager truncated to 15 chars
    pkill -9 etcd            2>/dev/null || true
  when: not kubeadm_config.stat.exists

- name: Wait for control-plane ports to be free after reset
  wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 60
    delay: 2
  loop:
  - 6443 # kube-apiserver
  - 10257 # kube-controller-manager
  - 10259 # kube-scheduler
  - 2379 # etcd client
  - 2380 # etcd peer
  when: not kubeadm_config.stat.exists

- name: Wait for hostonly interface (192.168.56.10) to be assigned
  shell: ip addr show | grep -c '192.168.56.10'
  register: iface_check
  until: iface_check.rc == 0 and iface_check.stdout | int > 0
  retries: 24
  delay: 5
  when: not kubeadm_config.stat.exists

- name: Get installed kubeadm version
  command: kubeadm version -o short
  register: kubeadm_ver
  when: not kubeadm_config.stat.exists

- name: Write kubeadm init config (embeds failSwapOn + timeouts)
  become: true
  copy:
    dest: /tmp/kubeadm-init-config.yaml
    mode: '0644'
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: 192.168.56.10
        bindPort: 6443
      timeouts:
        # Generous timeouts for slow VirtualBox+Hyper-V disk I/O.
        # controlPlaneComponentHealthCheck: how long to poll /healthz
        # kubernetesAPICall: per-request timeout for API calls (default is ~10s
        #   in k8s 1.33 — too short for first etcd WAL fsync on slow VirtualBox)
        controlPlaneComponentHealthCheck: 20m0s
        kubernetesAPICall: 5m0s
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: {{ kubeadm_ver.stdout | trim }}
      networking:
        podSubnet: 10.244.0.0/16
      etcd:
        local:
          # Tuned for slow VirtualBox disk: default 100ms/1000ms triggers
          # constant leader re-elections when WAL fsync > election-timeout.
          extraArgs:
          - name: heartbeat-interval
            value: "250"
          - name: election-timeout
            value: "2500"
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      failSwapOn: false
  when: not kubeadm_config.stat.exists

# Pre-pull images before init so the 20m health-check timer isn't eaten
# by image downloads through the (not-yet-running) zot.local mirror.
- name: Pre-pull kubeadm control-plane images
  become: true
  command: kubeadm config images pull --config /tmp/kubeadm-init-config.yaml
  retries: 3
  delay: 10
  register: image_pull_result
  until: image_pull_result.rc == 0
  when: not kubeadm_config.stat.exists

- name: Initialize Kubernetes control plane
  become: true
  shell: |
    set -o pipefail
    kubeadm init --config /tmp/kubeadm-init-config.yaml | tee /root/kubeadm-init.out
  args:
    executable: /bin/bash
  when: not kubeadm_config.stat.exists

- name: Restart chrony after kubeadm init (re-enable NTP now that certs are stable)
  systemd:
    name: chrony
    state: started
  become: true

- name: Enable and start kubelet (just in case)
  systemd:
    name: kubelet
    enabled: yes
    state: started

- name: Tune etcd timeouts for slow VirtualBox disk (heartbeat 250ms, election 2500ms)
  shell: |
    if ! grep -q 'heartbeat-interval' /etc/kubernetes/manifests/etcd.yaml; then
      sed -i '/- --trusted-ca-file/a\    - --heartbeat-interval=250\n    - --election-timeout=2500' \
        /etc/kubernetes/manifests/etcd.yaml
    fi
  args:
    executable: /bin/bash

- name: Tune kube-controller-manager leader election for slow etcd
  shell: |
    if ! grep -q 'leader-elect-lease-duration' /etc/kubernetes/manifests/kube-controller-manager.yaml; then
      sed -i 's/--leader-elect=true/--leader-elect=true\n    - --leader-elect-lease-duration=60s\n    - --leader-elect-renew-deadline=40s/' \
        /etc/kubernetes/manifests/kube-controller-manager.yaml
    fi
  args:
    executable: /bin/bash

- name: Tune kube-scheduler leader election for slow etcd
  shell: |
    if ! grep -q 'leader-elect-lease-duration' /etc/kubernetes/manifests/kube-scheduler.yaml; then
      sed -i 's/--leader-elect=true/--leader-elect=true\n    - --leader-elect-lease-duration=60s\n    - --leader-elect-renew-deadline=40s/' \
        /etc/kubernetes/manifests/kube-scheduler.yaml
    fi
  args:
    executable: /bin/bash

- name: Create .kube directory for vagrant user
  file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'

- name: Copy kubeconfig to vagrant user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: yes
    owner: vagrant
    group: vagrant
    mode: '0600'

- name: Check if Calico is already installed
  command: kubectl get daemonset calico-node -n kube-system
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_status
  failed_when: false
  changed_when: false

- name: Download Calico manifest to control machine
  delegate_to: localhost
  become: false
  get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml
    dest: /tmp/calico.yaml
    mode: '0644'
    force: false
  when: calico_status.rc != 0

- name: Copy Calico manifest to master
  copy:
    src: /tmp/calico.yaml
    dest: /tmp/calico.yaml
    mode: '0644'
  when: calico_status.rc != 0

- name: Apply Calico CNI
  shell: |
    kubectl apply -f /tmp/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: calico_status.rc != 0

- name: Save kubeadm join command
  shell: |
    kubeadm token create --print-join-command > /home/vagrant/kubeadm-join.sh
  args:
    creates: /home/vagrant/kubeadm-join.sh

- name: Make join script executable
  file:
    path: /home/vagrant/kubeadm-join.sh
    mode: '0755'
    owner: vagrant
    group: vagrant

# ---------------------------------------------------------------------
# NFS Server — exports /share for the nfs-subdir-external-provisioner
# ---------------------------------------------------------------------

- name: Install nfs-kernel-server
  apt:
    name: nfs-kernel-server
    state: present
    update_cache: yes

- name: Create /share export directory
  file:
    path: /share
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'

- name: Export /share via NFS to cluster subnet
  lineinfile:
    path: /etc/exports
    line: '/share 192.168.56.0/24(rw,sync,no_subtree_check,no_root_squash)'
    regexp: '^/share'
    state: present

- name: Enable and start nfs-kernel-server
  systemd:
    name: nfs-kernel-server
    state: started
    enabled: true

- name: Re-export NFS shares
  command: exportfs -ra
