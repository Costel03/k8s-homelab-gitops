{{- if .Values.apps.metallb.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
  - repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.9
    helm:
      valueFiles:
      - $values/metallb/helm/metallb/values.yaml
  - repoURL: https://github.com/Costel03/k8s-homelab-gitops.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/Costel03/k8s-homelab-gitops.git
    targetRevision: main
    path: metallb/helm/metallb/templates

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
{{- end }}
